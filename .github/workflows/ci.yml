name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Node capture tests use the stdlib OS-lock holder.
      - run: npm ci
      - run: npm run source:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run sync:apex
      - run: npm run release:check -- --source
      - run: npm run build

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # test-server-performance compares against the server.py of an earlier commit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install uv==0.13.6
      - run: uv sync --frozen
      - run: npm run test:py
        env:
          APEX_PYTHON: .venv/bin/python

  browsers:
    # One job per engine, side by side (they took 15 minutes in one job). Screenshot baselines are Windows-only, so the
    # @visual tests run locally in `npm run check:full`, not here.
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --grep-invert @visual --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/

  audits:
    # The four page audits (Linear look, charts, accessibility, layout coverage), two at a time, on Chromium.
    name: Page audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run sync:apex
      - run: |
          node scripts/audit-linear.mjs --browser chromium & L=$!
          node scripts/audit-charts.mjs --browser chromium & C=$!
          wait $L; a=$?; wait $C; b=$?
          node scripts/audit-a11y.mjs --browser chromium & A=$!
          node scripts/audit-coverage.mjs --browser chromium & V=$!
          wait $A; c=$?; wait $V; d=$?
          exit $(( a || b || c || d ))
