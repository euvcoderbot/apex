[project]
name = "apex-telemetry-api"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "fastf1>=3.9.2,<4",
  "pdfplumber>=0.11,<1",
]

[tool.uv]
package = false
# All charts are rendered in the browser. FastF1's plotting-only dependencies
# are unused by this service; retain scipy for its telemetry interpolation.
# This API reads published HTTP archives, not the live SignalR/WebSocket client.
# pyjwt and cryptography stay: FastF1 3.9.2 imports jwt's RSA support when the package loads
# (fastf1.internals.f1account), so without them `import fastf1` fails.
exclude-dependencies = ["matplotlib", "timple", "signalrcore", "websockets"]
